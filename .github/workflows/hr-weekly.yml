name: HR weekly email

# Every Thursday evening: company summary to admins, team summary to each
# team manager. The database login can only call hr_weekly_report().
on:
  schedule:
    - cron: "0 15 * * 4"   # Thursday, 5-6pm Cairo
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/report
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: tools/report
        run: npm install --no-audit --no-fund
      - name: Send
        working-directory: tools/report
        env:
          NEON_REPORT_URL: ${{ secrets.NEON_REPORT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PORTAL_URL: https://sherifmounierhr-cpu.github.io/Sheko-s/hr/
        run: node weekly.mjs
