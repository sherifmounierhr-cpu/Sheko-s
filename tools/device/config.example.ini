; انسخ الملف ده باسم config.ini على كمبيوتر المكتب واملاه.
; config.ini فيه باسورد، فمتبعتهوش لحد ومترفعهوش على GitHub.

[device]
; من الجهاز: Menu > Comm > Ethernet > IP Address
ip = 192.168.1.X
port = 4370
; من الجهاز: Menu > Comm > PC Connection > Comm Key
; لازم يكون نفس الرقم اللي حطيته على الجهاز (أرقام بس، مش 0)
comm_key = 0
; رقم الجهاز التسلسلي: Menu > System Info > Device Info > Serial Number
; لازم يكون نفس الرقم اللي سجلته في البوابة (رفع البصمة > جهاز البصمة)
serial = CHANGE-ME
timeout = 15
udp = no

[portal]
; رابط Neon بالدخول hr_device (زي ما عملنا مع hr_report بالظبط)
; سيب آخر الرابط زي ما هو: بيتأكد إن السيرفر هو Neon الحقيقي قبل ما يبعت الباسورد
connection = postgresql://hr_device:PASSWORD@HOST/neondb?sslmode=verify-full&channel_binding=require
